  #counter { font-variant-numeric: tabular-nums; min-width: 5em; text-align: center; }

  .slide { display: none; }

  .slide img {

  .hint { opacity: .7; font-size: 12px; padding: 8px 16px 24px; text-align: center; }

<p class="hint">キーボードの ← → でも移動できます</p>
<script>
(function() {
  const slides = Array.from(document.querySelectorAll('.slide'));
  let i = 0;
  const counter = document.getElementById('counter');
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((el, idx) => el.classList.toggle('active', idx === i));
    counter.textContent = (i + 1) + ' / ' + slides.length;
    history.replaceState(null, '', '#s' + (i + 1));
  }
  document.getElementById('prev').onclick = () => show(i - 1);
  document.getElementById('next').onclick = () => show(i + 1);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(i + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(i - 1); }
  });
  const m = location.hash.match(/s(\d+)/);
  show(m ? parseInt(m[1], 10) - 1 : 0);
})();
</script>
